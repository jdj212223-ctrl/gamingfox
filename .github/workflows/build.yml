# Builds GamingFox from Mozilla's Firefox source code in GitHub Actions (not on your computer), for
# Linux (.tar.xz, .rpm, .deb), Windows (.exe installer, .zip) and Mac (.dmg, Apple Silicon).
# Each one is installed and started on a real machine of that kind (a screenshot of the start page),
# then everything is published together as one release.
name: Build GamingFox
on:
  push: { branches: [main] }
  workflow_dispatch:
    inputs:
      firefox_version:
        description: "Firefox version to build on (leave empty for the newest)"
        required: false
  schedule: [{ cron: "0 6 * * 3" }]   # every Wednesday: rebuild if Mozilla released a new Firefox (security fixes)
concurrency: { group: gamingfox-build, cancel-in-progress: false }
permissions: { contents: write }

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - id: v
        name: Which Firefox version?
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.firefox_version }}
        run: |
          v="${WANTED:-$(curl -fsSL https://product-details.mozilla.org/1.0/firefox_versions.json | jq -r .LATEST_FIREFOX_VERSION)}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          skip=false
          if [ "${{ github.event_name }}" = schedule ] && \
             gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' | grep -q "^v$v-"; then
            skip=true   # already built this Firefox version
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Building on Firefox $v (skip=$skip)"

  # ---- Compile (hours). Each platform gets a second job only if the first ran out of time. ----------
  linux-1:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/compile.yml
    with: { target: linux, version: "${{ needs.prepare.outputs.version }}", attempt: "1" }
  linux-2:
    needs: [prepare, linux-1]
    if: needs.linux-1.outputs.done != 'true'
    uses: ./.github/workflows/compile.yml
    with: { target: linux, version: "${{ needs.prepare.outputs.version }}", attempt: "2" }

  windows-1:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/compile.yml
    with: { target: windows, version: "${{ needs.prepare.outputs.version }}", attempt: "1" }
  windows-2:
    needs: [prepare, windows-1]
    if: needs.windows-1.outputs.done != 'true'
    uses: ./.github/workflows/compile.yml
    with: { target: windows, version: "${{ needs.prepare.outputs.version }}", attempt: "2" }

  mac-1:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/compile.yml
    with: { target: mac, version: "${{ needs.prepare.outputs.version }}", attempt: "1" }
  mac-2:
    needs: [prepare, mac-1]
    if: needs.mac-1.outputs.done != 'true'
    uses: ./.github/workflows/compile.yml
    with: { target: mac, version: "${{ needs.prepare.outputs.version }}", attempt: "2" }

  # ---- Package and test on each kind of computer ------------------------------------------------------
  rpm:
    name: Fedora .rpm (install + screenshot)
    needs: [prepare, linux-1, linux-2]
    if: always() && (needs.linux-1.outputs.done == 'true' || needs.linux-2.outputs.done == 'true')
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:45
    steps:
      - name: Tools
        run: dnf -y install --setopt=install_weak_deps=False git tar xz rpm-build findutils dejavu-sans-fonts google-noto-sans-fonts util-linux shadow-utils
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: build-linux, path: out }
      - name: Build the .rpm
        run: |
          V="${{ needs.prepare.outputs.version }}"
          T=$(ls "$PWD"/out/gamingfox-*.linux-x86_64.tar.xz)
          # The browser's own libraries (libxul.so etc.) must not be looked for in other packages.
          privlibs="^($(tar -tJf "$T" | grep -E '\.so$' | xargs -n1 basename | sort -u | paste -sd'|'))"
          rpmbuild -bb packaging/gamingfox.spec \
            --define "_topdir $PWD/rpmbuild" \
            --define "gf_version $V" --define "gf_release ${{ github.run_number }}" \
            --define "gf_tarball $T" --define "gf_root $PWD" --define "gf_privlibs $privlibs"
          mkdir -p pkg && cp rpmbuild/RPMS/x86_64/*.rpm pkg/
      - name: Install on Fedora and check it starts
        run: |
          dnf -y install pkg/*.rpm
          gamingfox --version
          useradd -m tester
          mkdir -p /tmp/shots && chmod 777 /tmp/shots
          runuser -u tester -- bash -c '
            set -e
            mkdir -p /tmp/p1 /tmp/p2
            timeout 180 gamingfox --headless --profile /tmp/p1 --window-size=1280,800 \
              --screenshot /tmp/shots/screenshot-fedora.png file:///usr/lib64/gamingfox/start.html
            timeout 180 gamingfox --headless --profile /tmp/p2 --window-size=1280,900 \
              --screenshot /tmp/shots/screenshot-policies.png about:policies || true
          '
          test -s /tmp/shots/screenshot-fedora.png
          cp /tmp/shots/*.png pkg/
      - uses: actions/upload-artifact@v4
        with: { name: pkg-rpm, path: pkg/, compression-level: 0 }

  deb:
    name: Ubuntu .deb + .tar.xz (install + screenshot)
    needs: [prepare, linux-1, linux-2]
    if: always() && (needs.linux-1.outputs.done == 'true' || needs.linux-2.outputs.done == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: build-linux, path: out }
      - name: Build the .deb
        run: |
          mkdir -p pkg && cp out/*.tar.xz pkg/
          packaging/build-deb.sh out/gamingfox-*.linux-x86_64.tar.xz "${{ needs.prepare.outputs.version }}" "${{ github.run_number }}" pkg
          dpkg-deb --info pkg/*.deb
      - name: Install on Ubuntu and check it starts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./pkg/*.deb
          gamingfox --version
          mkdir -p /tmp/p1
          timeout 180 gamingfox --headless --profile /tmp/p1 --window-size=1280,800 \
            --screenshot "$PWD/pkg/screenshot-ubuntu.png" file:///usr/lib/gamingfox/start.html
          test -s pkg/screenshot-ubuntu.png
      - uses: actions/upload-artifact@v4
        with: { name: pkg-deb, path: pkg/, compression-level: 0 }

  windows:
    name: Windows installer (install + screenshot)
    needs: [prepare, windows-1, windows-2]
    if: always() && (needs.windows-1.outputs.done == 'true' || needs.windows-2.outputs.done == 'true')
    runs-on: windows-2025
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: build-windows, path: out }
      - name: Build the installer (.exe)
        run: |
          $V = "${{ needs.prepare.outputs.version }}"
          New-Item -ItemType Directory -Force pkg, unzipped | Out-Null
          $zip = Get-ChildItem out\*.zip | Select-Object -First 1
          Copy-Item $zip pkg\
          Expand-Archive $zip -DestinationPath unzipped
          $nsis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $nsis) {
            if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress | Out-Null }
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          } else { $makensis = $nsis.Source }
          & $makensis /V2 "/DVERSION=$V" "/DSRCDIR=$PWD\unzipped\gamingfox" "/DOUTFILE=$PWD\pkg\GamingFox-$V-Setup.exe" packaging\windows\gamingfox.nsi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem pkg
      - name: Install on Windows and check it starts
        run: |
          $setup = Get-ChildItem pkg\*-Setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $exe = "$env:ProgramFiles\GamingFox\gamingfox.exe"
          if (-not (Test-Path $exe)) { throw "GamingFox was not installed" }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\p1" | Out-Null
          $start = "file:///" + (("$env:ProgramFiles\GamingFox\start.html" -replace '\\','/') -replace ' ','%20')
          $p = Start-Process $exe -ArgumentList "--headless","--profile","`"$env:RUNNER_TEMP\p1`"","--window-size=1280,800","--screenshot","`"$PWD\pkg\screenshot-windows.png`"",$start -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "GamingFox did not finish in time" }
          if (-not (Test-Path pkg\screenshot-windows.png)) { throw "no screenshot" }
          Get-ChildItem pkg
      - uses: actions/upload-artifact@v4
        with: { name: pkg-windows, path: pkg/, compression-level: 0 }

  mac:
    name: Mac .dmg (screenshot)
    needs: [prepare, mac-1, mac-2]
    if: always() && (needs.mac-1.outputs.done == 'true' || needs.mac-2.outputs.done == 'true')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: build-mac, path: out }
      - name: Finish the app (our icon, local signature) and make the .dmg
        run: |
          V="${{ needs.prepare.outputs.version }}"
          mkdir -p stage pkg
          tar -xJf out/*.app.tar.xz -C stage
          APP=$(ls -d stage/*.app | head -1)
          # Use our fox icon file (the built-in icon catalogue still holds the unofficial icon).
          rm -f "$APP/Contents/Resources/Assets.car"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconName" "$APP/Contents/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$APP/Contents/Info.plist" || true
          # Not signed by Apple (that needs a paid Apple developer account): a local ("ad-hoc") signature.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep "$APP" && echo "signature ok"
          ln -s /Applications stage/Applications
          hdiutil create -volname GamingFox -srcfolder stage -fs HFS+ -format UDZO -ov "pkg/GamingFox-$V-mac-arm64.dmg"
          echo "APP=$APP" >> "$GITHUB_ENV"
      - name: Check it starts on a Mac
        run: |
          mkdir -p "$RUNNER_TEMP/p1"
          "$APP/Contents/MacOS/gamingfox" --version
          "$APP/Contents/MacOS/gamingfox" --headless --profile "$RUNNER_TEMP/p1" --window-size=1280,800 \
            --screenshot "$PWD/pkg/screenshot-mac.png" "file://$PWD/$APP/Contents/Resources/start.html" &
          pid=$!; for i in $(seq 180); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          test -s pkg/screenshot-mac.png
          ls -lh pkg
      - uses: actions/upload-artifact@v4
        with: { name: pkg-mac, path: pkg/, compression-level: 0 }

  # ---- One release with everything ---------------------------------------------------------------------
  release:
    needs: [prepare, rpm, deb, windows, mac]
    if: always() && needs.rpm.result == 'success' && needs.deb.result == 'success' && needs.windows.result == 'success' && needs.mac.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: pkg-*, path: out, merge-multiple: true }
      - name: Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V="${{ needs.prepare.outputs.version }}"
          N="${{ github.run_number }}"
          tag="v$V-$N"
          cd out && ls -lh
          sha256sum *.tar.xz *.rpm *.deb *.exe *.zip *.dmg > SHA256SUMS
          cat > notes.md <<NOTES
          GamingFox built from Mozilla's Firefox $V source code, for Linux, Windows and Mac.
          Each one was installed and started automatically; the screenshot-*.png files show its start page.

          | Computer | Download | How to install |
          |---|---|---|
          | **Hollow OS, Fedora** | \`gamingfox-$V-$N.x86_64.rpm\` | \`sudo dnf install ./gamingfox-$V-$N.x86_64.rpm\` (Hollow OS already has it) |
          | **Ubuntu, Debian, Mint, Pop!_OS** | \`gamingfox_$V-${N}_amd64.deb\` | Double-click it, or \`sudo apt install ./gamingfox_$V-${N}_amd64.deb\` |
          | **Any other Linux** | \`gamingfox-$V.linux-x86_64.tar.xz\` | Unpack it and run \`gamingfox/gamingfox\` |
          | **Windows 10/11 (64-bit)** | \`GamingFox-$V-Setup.exe\` | Run it. Windows may say "Windows protected your PC" (the installer isn't signed): click **More info → Run anyway**. Or use the \`.zip\` (no install). |
          | **Mac (Apple Silicon: M1 and newer)** | \`GamingFox-$V-mac-arm64.dmg\` | Open the .dmg and drag GamingFox to Applications. It isn't signed by Apple, so the first time: **right-click GamingFox → Open → Open**. On macOS 15 or newer, if it still won't open: **System Settings → Privacy & Security → Open Anyway**. |

          Intel Macs aren't supported yet.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)
          NOTES
          sed -i 's/^          //' notes.md
          # GitHub's API sometimes answers "HTTP 500": try up to 5 times (cleaning up a half-made release in between).
          for try in 1 2 3 4 5; do
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            if gh release create "$tag" *.tar.xz *.rpm *.deb *.exe *.zip *.dmg *.png SHA256SUMS \
                 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                 --title "GamingFox $V (build $N): Linux, Windows, Mac" --notes-file notes.md; then exit 0; fi
            echo "Release failed (try $try), retrying in 30 s"; sleep 30
          done
          exit 1
