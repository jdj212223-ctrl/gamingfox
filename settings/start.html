<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>GamingFox</title>
<style>
:root{--bg:#14121a;--card:#201b27;--ink:#eae4de;--soft:#968e8a;--acc:#d9784f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 120%,#3a2420,var(--bg) 60%);color:var(--ink);font:16px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
h1{font-weight:600;letter-spacing:.08em;margin:0 0 6px}p{color:var(--soft);margin:0 0 28px}
form{width:min(640px,100%);margin-bottom:28px}input{width:100%;padding:14px 18px;border-radius:14px;border:1px solid #3a3242;background:var(--card);color:var(--ink);font-size:17px;outline:none}input:focus{border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:min(760px,100%)}
a.c{display:block;padding:16px;border-radius:14px;background:var(--card);color:var(--ink);text-decoration:none;border:1px solid transparent}a.c:hover{border-color:var(--acc)}a.c small{display:block;color:var(--soft)}
</style></head><body>
<h1>GamingFox</h1><p>No ads, no tracking, video on the graphics card.</p>
<form action="https://duckduckgo.com/" method="get"><input name="q" placeholder="Search the web" autofocus></form>
<div class="grid">
<a class="c" href="https://store.steampowered.com">Steam Store<small>buy and download games</small></a>
<a class="c" href="https://www.protondb.com">ProtonDB<small>will my Windows game run?</small></a>
<a class="c" href="https://modrinth.com">Modrinth<small>Minecraft mods for OneClient</small></a>
<a class="c" href="https://github.com/jdj212223-ctrl/hollow-hours/releases">Hollow Hours<small>what's new</small></a>
<a class="c" href="https://www.youtube.com">YouTube<small>hardware-decoded</small></a>
<a class="c" href="https://www.twitch.tv">Twitch<small>watch streams</small></a>
</div></body></html>
