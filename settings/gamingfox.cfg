// GamingFox settings. (This first line must stay a comment.)
// Runs once at start-up. "defaultPref" = our default, which the user can still change in Settings.
// Everything is wrapped in try/catch: a mistake here must never stop the browser from opening.

try {

const { classes: Cc, interfaces: Ci, utils: Cu } = Components;
const Services = globalThis.Services || ChromeUtils.importESModule("resource://gre/modules/Services.sys.mjs").Services;

// --- Start page: the GamingFox page that ships next to the browser ----------------------------------
try {
  const dir = Services.dirsvc.get("GreD", Ci.nsIFile);
  dir.append("start.html");
  if (dir.exists()) {
    defaultPref("browser.startup.homepage", Services.io.newFileURI(dir).spec);
  }
} catch (e) {}
defaultPref("browser.startup.page", 1);                         // open the start page

// --- Look: dark theme ---------------------------------------------------------------------------------
defaultPref("extensions.activeThemeID", "firefox-compact-dark@mozilla.org");
defaultPref("layout.css.prefers-color-scheme.content-override", 0);   // websites in dark mode too

// --- Video on the graphics card (VA-API) -------------------------------------------------------------
defaultPref("media.ffmpeg.vaapi.enabled", true);
defaultPref("media.hardware-video-decoding.enabled", true);
defaultPref("media.hardware-video-decoding.force-enabled", true);
defaultPref("media.rdd-ffmpeg.enabled", true);
defaultPref("gfx.webrender.all", true);

// --- Easy on RAM ----------------------------------------------------------------------------------------
defaultPref("dom.ipc.processCount", 4);                          // fewer web-page processes
defaultPref("dom.ipc.processCount.webIsolated", 2);
defaultPref("browser.tabs.unloadOnLowMemory", true);             // unload old tabs when memory runs low
defaultPref("browser.low_commit_space_threshold_percent", 10);
defaultPref("browser.sessionhistory.max_total_viewers", 2);
defaultPref("image.mem.decode_bytes_at_a_time", 65536);

// --- Gentle on the SSD: cache in memory, fewer session saves -----------------------------------------
defaultPref("browser.cache.disk.enable", false);
defaultPref("browser.cache.memory.enable", true);
defaultPref("browser.cache.memory.capacity", 262144);            // 256 MB
defaultPref("browser.sessionstore.interval", 60000);             // save open tabs once a minute, not every 15 s

// --- No telemetry, studies, Pocket or sponsored content ---------------------------------------------
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.unified", false);
lockPref("toolkit.telemetry.archive.enabled", false);
lockPref("toolkit.telemetry.server", "data:,");
lockPref("toolkit.telemetry.newProfilePing.enabled", false);
lockPref("toolkit.telemetry.shutdownPingSender.enabled", false);
lockPref("toolkit.telemetry.updatePing.enabled", false);
lockPref("toolkit.telemetry.bhrPing.enabled", false);
lockPref("toolkit.telemetry.firstShutdownPing.enabled", false);
lockPref("toolkit.telemetry.coverage.opt-out", true);
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("datareporting.policy.dataSubmissionEnabled", false);
lockPref("datareporting.usage.uploadEnabled", false);
lockPref("app.shield.optoutstudies.enabled", false);
lockPref("app.normandy.enabled", false);
lockPref("app.normandy.api_url", "");
lockPref("browser.discovery.enabled", false);
lockPref("browser.ping-centre.telemetry", false);
lockPref("extensions.pocket.enabled", false);
lockPref("browser.newtabpage.activity-stream.feeds.telemetry", false);
lockPref("browser.newtabpage.activity-stream.telemetry", false);
lockPref("browser.newtabpage.activity-stream.showSponsored", false);
lockPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false);
lockPref("browser.newtabpage.activity-stream.feeds.section.topstories", false);
lockPref("browser.newtabpage.activity-stream.default.sites", "");
lockPref("browser.urlbar.suggest.quicksuggest.sponsored", false);
lockPref("browser.urlbar.suggest.quicksuggest.nonsponsored", false);
lockPref("extensions.htmlaboutaddons.recommendations.enabled", false);
lockPref("extensions.getAddons.showPane", false);
lockPref("browser.shopping.experience2023.enabled", false);
defaultPref("browser.aboutConfig.showWarning", false);
defaultPref("browser.shell.checkDefaultBrowser", false);

// --- Game Mode -----------------------------------------------------------------------------------------
// While a game runs (Feral GameMode is active, e.g. a Steam game in Hollow OS), or when you press the
// Game Mode button: videos and music pause and background tabs are unloaded to free RAM and CPU.
// Press the button again (or quit the game) to turn it off. Pages reload when you click their tab.
defaultPref("gamingfox.gamemode.auto", true);         // switch on by itself while a game runs
defaultPref("gamingfox.gamemode.pauseMedia", true);   // pause videos and music
defaultPref("gamingfox.gamemode.unloadTabs", true);   // unload background tabs

(function gameMode() {
  const ICON =
    "data:image/svg+xml," +
    encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="context-fill">' +
        '<path d="M4.5 4h7a3.5 3.5 0 0 1 3.4 4.3l-.7 3a2 2 0 0 1-3.4.9L9.6 11H6.4l-1.2 1.2a2 2 0 0 1-3.4-.9l-.7-3A3.5 3.5 0 0 1 4.5 4zM5 6v1.2H3.8v1.6H5V10h1.6V8.8h1.2V7.2H6.6V6zm6.2 1a.9.9 0 1 0 0 1.8.9.9 0 0 0 0-1.8z"/></svg>'
    );
  let manual = false;   // turned on with the button
  let game = false;     // a game is running
  let snoozed = false;  // turned off by hand while a game runs (until that game ends)
  let active = false;

  function windows() {
    return Services.wm.getEnumerator("navigator:browser");
  }

  function apply(on) {
    if (on === active) return;
    active = on;
    for (const win of windows()) {
      try {
        const gb = win.gBrowser;
        if (on) {
          for (const tab of gb.tabs) {
            const br = tab.linkedBrowser;
            if (Services.prefs.getBoolPref("gamingfox.gamemode.pauseMedia", true)) {
              try { br.browsingContext?.mediaController?.pause(); } catch (e) {}
            }
            if (Services.prefs.getBoolPref("gamingfox.gamemode.unloadTabs", true) &&
                !tab.selected && !tab.pinned && br.isConnected && !tab.hasAttribute("pending")) {
              try { gb.discardBrowser(tab); } catch (e) {}
            }
          }
        }
        const btn = win.document.getElementById("gamingfox-gamemode-button");
        if (btn) {
          btn.setAttribute("checked", on ? "true" : "false");
          btn.setAttribute("tooltiptext", on ? "Game Mode is ON: videos paused, background tabs unloaded. Click to turn off."
                                             : "Game Mode: pause videos and unload background tabs while you play.");
          btn.style.fill = on ? "#d9784f" : "";
        }
      } catch (e) {}
    }
  }
  const update = () => apply(manual || (game && !snoozed));

  function addButton() {
    try {
      const { CustomizableUI } = ChromeUtils.importESModule("resource:///modules/CustomizableUI.sys.mjs");
      if (CustomizableUI.getWidget("gamingfox-gamemode-button")?.provider === CustomizableUI.PROVIDER_API) return;
      CustomizableUI.createWidget({
        id: "gamingfox-gamemode-button",
        type: "button",
        label: "Game Mode",
        tooltiptext: "Game Mode: pause videos and unload background tabs while you play.",
        defaultArea: CustomizableUI.AREA_NAVBAR,
        onCreated(node) {
          node.style.listStyleImage = `url("${ICON}")`;
          node.style.setProperty("-moz-context-properties", "fill");
        },
        onCommand() {
          if (active) {
            manual = false;
            if (game) snoozed = true;   // off by hand wins until this game ends
          } else {
            manual = true;
            snoozed = false;
          }
          update();
        },
      });
    } catch (e) {
      Cu.reportError(e);
    }
  }

  // Ask Feral GameMode (gamemoded) every 15 seconds whether a game is running.
  async function poll() {
    if (!Services.prefs.getBoolPref("gamingfox.gamemode.auto", true)) return;
    try {
      const { Subprocess } = ChromeUtils.importESModule("resource://gre/modules/Subprocess.sys.mjs");
      const proc = await Subprocess.call({ command: "/usr/bin/gamemoded", arguments: ["-s"], stderr: "stdout" });
      let out = "", chunk;
      while ((chunk = await proc.stdout.readString())) out += chunk;
      await proc.wait();
      const running = /\bis active\b/.test(out);
      if (!running) snoozed = false;
      if (running !== game) { game = running; update(); }
    } catch (e) {
      // gamemoded isn't installed: auto mode just stays off.
    }
  }

  let started = false;
  Services.obs.addObserver((subject) => {
    addButton();
    if (active) { apply(false); apply(true); }   // a new window opened while Game Mode is on
    if (!started) {
      started = true;
      try {
        const f = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
        f.initWithPath("/usr/bin/gamemoded");
        if (f.exists()) {
          const { setInterval } = ChromeUtils.importESModule("resource://gre/modules/Timer.sys.mjs");
          setInterval(poll, 15000);
        }
      } catch (e) {}
    }
  }, "browser-delayed-startup-finished");
})();

} catch (e) {
  try { Cu.reportError(e); } catch (_) {}
}
